name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push makes the in-flight run for the same ref obsolete.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitHub runners have no GPU, so TF logs a CUDA warning on every import.
  TF_CPP_MIN_LOG_LEVEL: "2"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check --output-format=github .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy
        # Tests and benchmarks are checked too: the relaxed overrides in
        # pyproject.toml only mean anything if these paths are actually visited.
        run: mypy gpu_clahe tests benchmarks

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every failing combination, not just the first.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          # Spot-check other platforms without paying for the full matrix.
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run tests
        # GPU-marked tests skip automatically on these runners; see
        # tests/conftest.py. The CPU path is still exercised in full.
        run: pytest --cov=gpu_clahe --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check metadata
        # Catches the class of packaging bug that made the previous release
        # unbuildable: a version that cannot be resolved, or a README that
        # PyPI would reject.
        run: twine check dist/*
      - name: Verify the wheel imports and runs
        run: |
          pip install dist/*.whl
          cd "$(mktemp -d)"  # import the installed package, not the source tree
          python -c "
          import numpy as np, gpu_clahe
          print('version', gpu_clahe.__version__)
          out = gpu_clahe.convert_clahe(
              np.random.default_rng(0).integers(0, 256, (4, 64, 64), dtype=np.uint8)
          )
          assert out.shape == (4, 64, 64) and out.dtype == np.uint8
          print('smoke test OK')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
