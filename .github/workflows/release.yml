name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check the tag matches the package version
        # A tag that disagrees with gpu_clahe.version is the easiest way to
        # publish something mislabelled, and it is trivial to catch here.
        #
        # version.py is read as a standalone file rather than imported as
        # gpu_clahe.version: importing the submodule executes the package
        # __init__, which pulls in TensorFlow, and TensorFlow is deliberately
        # not installed in this job. runpy keeps the check dependency-free,
        # which is the same property that lets setuptools resolve the version
        # at build time.
        run: |
          python -m pip install --upgrade pip build
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c 'import runpy; print(runpy.run_path("gpu_clahe/version.py")["__version__"])')"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match __version__ $PKG"
            exit 1
          fi
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Requires a "pypi" environment configured with trusted publishing:
    # https://docs.pypi.org/trusted-publishers/
    environment:
      name: pypi
      url: https://pypi.org/p/gpu-clahe
    permissions:
      id-token: write  # mints the short-lived token; no API key stored in CI
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
